name: Deploy to GitHub Pages

# The site is pure static files, so deployment is just mirroring the branch
# to gh-pages — GitHub Pages serves from there (auto-enabled on first push).
on:
  push:
    branches:
      - master
      - claude/photographer-travel-webpage-f70ptk
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror to gh-pages
        run: git push origin --force HEAD:gh-pages
